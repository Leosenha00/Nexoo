# Initial evaluation deployment. Verify current free-tier eligibility/limits in Render.
# No paid resources are selected by this blueprint.
services:
  - type: web
    name: nexo
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nexo-db
          property: connectionString
      - key: STUN_URL
        value: stun:stun.l.google.com:19302
      - key: TURN_URL
        sync: false
      - key: TURN_SECRET
        sync: false
      - key: SMTP_URL
        sync: false
      - key: MAIL_FROM
        sync: false

databases:
  - name: nexo-db
    plan: free
    databaseName: nexo
    user: nexo
    ipAllowList: []

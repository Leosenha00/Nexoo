name: Nexoo
options:
  minimumXcodeGenVersion: 2.44.1
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    NEXOO_BUNDLE_ID: com.nexoo.ios
    NEXOO_SERVER_URL: https://nexoo-fv9s.onrender.com
    CODE_SIGN_STYLE: Automatic
targets:
  Nexoo:
    type: application
    platform: iOS
    sources:
      - NexooApp.swift
      - AppConfiguration.swift
    info:
      path: Generated/NexooInfo.plist
      properties:
        CFBundleDisplayName: Nexoo
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        NexooServerURL: $(NEXOO_SERVER_URL)
        NSCameraUsageDescription: "O Nexoo utiliza a câmera em chamadas de vídeo."
        NSMicrophoneUsageDescription: "O Nexoo utiliza o microfone em chamadas."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(NEXOO_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
  NexooTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Nexoo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(NEXOO_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
  NexooUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Nexoo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(NEXOO_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Nexoo:
    build:
      targets:
        Nexoo: all
    test:
      targets:
        - NexooTests
        - NexooUITests
      gatherCoverageData: true

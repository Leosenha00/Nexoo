name: Build iOS unsigned IPA
on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-unsigned.yml'
jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: |
          cd ios
          xcodegen generate
      - name: Build iOS app without signing
        run: |
          xcodebuild -project ios/Nexoo.xcodeproj -scheme Nexoo -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/NexooDerivedData" CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP/NexooDerivedData/Build/Products/Release-iphoneos/Nexoo.app" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qr "$GITHUB_WORKSPACE/Nexoo-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Nexoo-unsigned-IPA
          path: Nexoo-unsigned.ipa
          if-no-files-found: error

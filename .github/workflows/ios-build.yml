name: iOS simulator validation
on:
  workflow_dispatch:
  push:
    branches: [ios-native-preparation]
    paths: ['ios/**', '.github/workflows/ios-build.yml']
  pull_request:
    paths: ['ios/**', '.github/workflows/ios-build.yml']
permissions:
  contents: read
jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Test signing validation logic
        run: python3 -m unittest discover -s ios/scripts -p 'test_*.py' -v
      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project and record toolchain
        run: |
          mkdir -p ios/results
          xcodebuild -version | tee ios/results/toolchain.txt
          xcodegen --version | tee -a ios/results/toolchain.txt
          xcodegen generate --spec ios/project.yml
      - name: Build simulator without signing
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project ios/Nexoo.xcodeproj -scheme Nexoo -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath ios/DerivedData CODE_SIGNING_ALLOWED=NO build 2>&1 | tee ios/results/build.log
      - name: Unit and UI tests
        timeout-minutes: 10
        shell: bash
        run: |
          set -o pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for devices in d["devices"].values() for x in devices if x["name"].startswith("iPhone")))')
          xcrun simctl boot "$DEVICE_ID" || true
          python3 -c 'import subprocess,sys; subprocess.run(["xcrun", "simctl", "bootstatus", sys.argv[1], "-b"], check=True, timeout=180)' "$DEVICE_ID"
          xcodebuild -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 60 -maximum-test-execution-time-allowance 120 -project ios/Nexoo.xcodeproj -scheme Nexoo -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE_ID" -derivedDataPath ios/DerivedData -resultBundlePath ios/results/Tests.xcresult CODE_SIGNING_ALLOWED=NO test 2>&1 | tee ios/results/test.log
      - name: Diagnose failure
        if: failure()
        run: |
          xcrun simctl list devices > ios/results/simulators.log
          python3 ios/scripts/diagnose.py >> "$GITHUB_STEP_SUMMARY"
      - name: Save generated project
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nexoo-xcode-project-${{ github.sha }}
          path: |
            ios/Nexoo.xcodeproj
            ios/Generated
      - name: Save logs and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-validation-${{ github.sha }}
          path: ios/results/
          if-no-files-found: warn
      - name: Save simulator app (not installable on iPhone)
        uses: actions/upload-artifact@v4
        with:
          name: Nexoo-simulator-${{ github.sha }}
          path: ios/DerivedData/Build/Products/Debug-iphonesimulator/Nexoo.app
          if-no-files-found: error

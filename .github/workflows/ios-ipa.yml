name: iOS signed device archive
on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: Explicit app Bundle ID registered with Apple
        required: true
        default: com.nexoo.ios
      team_id:
        description: Apple Team ID matching both profiles
        required: true
      export_method:
        description: Device distribution supported by the supplied profiles
        type: choice
        options: [debugging, release-testing]
        default: debugging
permissions:
  contents: read
jobs:
  signed-device:
    runs-on: macos-15
    timeout-minutes: 35
    env:
      NEXOO_BUNDLE_ID: ${{ inputs.bundle_id }}
      APPLE_TEAM_ID: ${{ inputs.team_id }}
      EXPORT_METHOD: ${{ inputs.export_method }}
    steps:
      - uses: actions/checkout@v5
      - name: Prepare temporary signing directory
        run: echo "SIGNING_DIR=$RUNNER_TEMP/nexoo-signing" >> "$GITHUB_ENV"
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Validate signing material
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_APP_PROFILE_BASE64: ${{ secrets.APPLE_APP_PROFILE_BASE64 }}
          APPLE_BROADCAST_PROFILE_BASE64: ${{ secrets.APPLE_BROADCAST_PROFILE_BASE64 }}
        run: bash ios/scripts/prepare_signing.sh
      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate --spec ios/project.yml
          mkdir -p ios/results
      - name: Archive signed device app and extension
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project ios/Nexoo.xcodeproj -scheme Nexoo -configuration Release -destination 'generic/platform=iOS' -xcconfig "$SIGNING_DIR/Signing.xcconfig" -archivePath "$SIGNING_DIR/Nexoo.xcarchive" NEXOO_BUNDLE_ID="$NEXOO_BUNDLE_ID" archive 2>&1 | tee ios/results/archive.log
      - name: Export signed IPA
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -exportArchive -archivePath "$SIGNING_DIR/Nexoo.xcarchive" -exportOptionsPlist "$SIGNING_DIR/ExportOptions.plist" -exportPath "$SIGNING_DIR/export" 2>&1 | tee ios/results/export.log
          bash ios/scripts/verify_ipa.sh
      - name: Upload verified IPA
        uses: actions/upload-artifact@v4
        with:
          name: Nexoo-signed-device
          path: ios/signed-output/*.ipa
          if-no-files-found: error
          retention-days: 7
      - name: Explain failure
        if: failure()
        run: python3 ios/scripts/diagnose.py >> "$GITHUB_STEP_SUMMARY"
      - name: Save build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signed-build-logs
          path: ios/results/*.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$SIGNING_DIR/signing.keychain-db" 2>/dev/null || true
          rm -rf "$SIGNING_DIR"
